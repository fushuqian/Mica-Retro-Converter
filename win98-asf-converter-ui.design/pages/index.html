<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Win98 ASF 视频转换器</title>
    <style id="theme-vars">
:root {
  --wac-background: #0f1115;
  --wac-foreground: #e8eaed;
  --wac-primary: #22aee6;
  --background: var(--wac-background);
  --foreground: var(--wac-foreground);
  --primary: var(--wac-primary);
}
html { font-family: system-ui, sans-serif; }
body { background: var(--wac-background); color: var(--wac-foreground); margin: 0; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-background: var(--wac-background);
    --color-foreground: var(--wac-foreground);
  }
  @layer base {
    body { background: var(--wac-background); color: var(--wac-foreground); }
  }
    </style>
    <style id="semantic-token-fallback">
      .bg-background { background-color: var(--wac-background); }
      .text-foreground { color: var(--wac-foreground); }
    </style>
</head>
<body>
  <section data-region='drop-zone' style="display:block;min-height:96px;background:#1e222b;color:#e8eaed;">Drop zone</section>
  <div data-region='file-queue' style="display:block;min-height:240px;background:#1e222b;color:#e8eaed;">File queue</div>
  <div data-region='settings' style="display:block;min-height:240px;background:#1e222b;color:#e8eaed;">Settings</div>
  <section data-region='log' style="display:block;min-height:160px;background:#1e222b;color:#e8eaed;">Log</section>
  <section data-region='actions' style="display:block;min-height:56px;background:#1e222b;color:#e8eaed;">Actions</section>
</body>
</html>
