<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MICA RETRO CONVERTER</title>
  <link rel="stylesheet" href="/src/styles.css">
</head>
<body>
  <div id="app">
    <header class="title-bar" data-tauri-drag-region>
      <div class="title-left">
        <span class="app-emoji">🎞️</span>
        <span class="app-name">MICA RETRO CONVERTER</span>
      </div>
      <div class="title-right">
        <button class="window-btn" id="btnPin" data-tauri-no-drag title="Always on Top">📌</button>
        <button class="window-btn" id="btnMinimize" data-tauri-no-drag title="Minimize">➖</button>
        <button class="window-btn btn-close" id="btnClose" data-tauri-no-drag title="Close">✖️</button>
      </div>
    </header>

    <main class="main-area" id="mainArea">
      <div class="empty-state" id="emptyState">
        <span class="empty-emoji">📁</span>
        <p>Drop video files here</p>
        <span>or <button class="link-btn" id="btnBrowse" data-tauri-no-drag>Browse</button></span>
      </div>
      <div class="task-list" id="taskList"></div>
      <div class="bottom-spacer"></div>
    </main>

    <footer class="bottom-bar">
      <div class="bottom-row bottom-row-output">
        <span class="row-label">输出位置</span>
        <span class="row-path" id="outputPath">同源目录</span>
        <button class="square-btn" id="btnOutputDir" data-tauri-no-drag title="修改路径">📁</button>
      </div>
      <div class="bottom-row bottom-row-action">
        <span class="row-label">转换预设</span>
        <select id="profileSelect" data-tauri-no-drag class="profile-select" title="Profile">
          <option value="0">加载中...</option>
        </select>
        <button class="square-btn btn-convert" id="btnConvert" data-tauri-no-drag title="开始转换" disabled>▶</button>
        <button class="square-btn" id="btnSettings" data-tauri-no-drag title="设置">⚙️</button>
      </div>
    </footer>
  </div>

  <div class="modal-overlay hidden" id="settingsModal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>⚙️ 设置</h2>
        <button class="modal-close" id="btnCloseSettings">✖️</button>
      </div>
      <div class="modal-body">
        <div class="setting-group">
          <label>分辨率</label>
          <div class="res-row">
            <input type="number" id="spinW" min="160" max="1920" step="16" value="640">
            <span>×</span>
            <input type="number" id="spinH" min="120" max="1080" step="16" value="480">
          </div>
        </div>
        <div class="setting-group">
          <label>视频码率 (kbps)</label>
          <input type="number" id="spinVBit" min="100" max="8000" step="100" value="800">
        </div>
        <div class="setting-group">
          <label>音频码率 (kbps)</label>
          <input type="number" id="spinABit" min="16" max="320" step="16" value="96">
        </div>
        <div class="setting-group">
          <label>帧率</label>
          <select id="fpsSelect"></select>
        </div>
        <div class="setting-group">
          <label>输出目录</label>
          <div class="dir-row">
            <input type="text" id="outputDir" placeholder="同源目录" readonly>
            <button class="btn-ghost" id="btnPickDir">浏览</button>
            <button class="btn-ghost" id="btnClearDir">清空</button>
          </div>
        </div>
        <div class="setting-row">
          <label><input type="checkbox" id="chkLetterbox" checked> 4:3 信箱</label>
          <label><input type="checkbox" id="chkSubtitle" checked> 烧录字幕</label>
        </div>
        <button class="btn-primary" id="btnSaveSettings">保存并关闭</button>
      </div>
    </div>
  </div>

  <div class="toast-container" id="toastContainer"></div>

  <script type="module">
    (async function bootstrap() {
      let base = (location.protocol === 'file:') ? (window.__WAC_API_BASE__ || 'http://127.0.0.1:8765') : '';
      try {
        if (window.__TAURI__) {
          const { invoke } = await import('@tauri-apps/api/core');
          const { listen } = await import('@tauri-apps/api/event');
          try {
            const info = await invoke('get_backend');
            if (info && info.base_url) base = info.base_url;
          } catch (_) {}
          await listen('backend://ready', (ev) => {
            const info = ev.payload;
            if (info && info.base_url) {
              base = info.base_url;
              window.__WAC_API_BASE__ = base;
              window.dispatchEvent(new CustomEvent('wac://backend-updated', { detail: info }));
            }
          });
        }
      } catch (e) { console.error('[bootstrap]', e); }
      window.__WAC_API_BASE__ = base;
    })();
  </script>
  <script type="module" src="/src/app.js"></script>
</body>
</html>
